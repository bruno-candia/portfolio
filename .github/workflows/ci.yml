name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint Check
        run: npm run lint

      - name: Unit Tests (Vitest)
        run: npx vitest run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests (Playwright)
        run: npx playwright test
        env:
          CI: true

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Full History
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan Git History
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false

  terraform-check:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: terraform/test/go.mod
          cache-dependency-path: terraform/test/go.sum

      - name: Sentry Alert Contract Test
        run: go test -run '^TestSentryMetricAlertContract$' -count=1
        working-directory: terraform/test

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.7'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Format Check (Fmt)
        id: fmt
        run: terraform fmt -check
        working-directory: terraform
        continue-on-error: true

      - name: Initialize
        id: init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate Configuration
        id: validate
        run: terraform validate
        working-directory: terraform
        continue-on-error: true

      - name: Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: terraform
          version: v1.28.14
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Remote Backend
        if: github.event_name == 'pull_request'
        run: terraform init
        working-directory: terraform

      - name: Plan (Pull Request)
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color > plan.txt 2>&1
        working-directory: terraform
        continue-on-error: true
        env:
          TF_VAR_app_secret_api_key: ${{ secrets.APP_SECRET_API_KEY }}
          TF_VAR_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_consent_secret: ${{ secrets.CONSENT_SECRET }}

      - name: Update Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style: \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization: \`${{ steps.init.outcome }}\`
            #### Terraform Validation: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail Plan Workflow if Error
        if: steps.plan.outcome == 'failure' || steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [quality, security, terraform-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: Production
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.7'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Initialize Remote Backend
        run: terraform init
        working-directory: terraform

      - name: Apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_app_secret_api_key: ${{ secrets.APP_SECRET_API_KEY }}
          TF_VAR_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_consent_secret: ${{ secrets.CONSENT_SECRET }}
